apiVersion: v1
kind: ConfigMap
metadata:
  name: pacs-config
  namespace: pacs-system
  labels:
    app: pacs-server
data:
  # S3 설정
  s3-bucket: "your-pacs-bucket"
  s3-region: "ap-northeast-2"
  
  # 애플리케이션 설정
  rust-log: "info"
  
  # GC 설정 (참고용, 실제는 CronJob args에서 지정)
  gc-timeout-pending-grace-days: "3"
  gc-cleanup-failed-grace-days: "7"
  gc-batch-size: "1000"

